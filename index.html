<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
</head>

<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
        <p>Quadro de organização de tarefas de projetos</p>
    </header>

    <main>
        <section aria-labelledby="titulo-filtros">  

            <h2 id="titulo-filtros">Busca</h2>

            <form>
                <label for="busca">Buscar tarefa por título:</label>
                <input type="search" id="busca" name="busca">

                <fieldset>

                    <legend>Status</legend>
                    <label>
                        <input type="radio" name="status">
                        Todos
                    </label>
                    <label>
                        <input type="radio" name="status">
                        A fazer
                    </label>
                    <label>
                        <input type="radio" name="status">
                        Em andamento
                    </label>
                    <label>
                        <input type="radio" name="status">
                        Em revisão
                    </label>
                    <label>
                        <input type="radio" name="status">
                        Concluída
                    </label>
                </fieldset>

                <fieldset>

                    <legend>Prioridade</legend>

                    <label>
                        <input type="radio" name="prioridade">
                        Baixa
                    </label>
                    <label>
                        <input type="radio" name="prioridade">
                        Média
                    </label>
                    <label>
                        <input type="radio" name="prioridade">
                        Alta
                    </label>

                </fieldset>

            </form>

        </section>
        <section aria-labelledby="fazer">

            <h2 id="fazer">A fazer</h2>
            <ul>
            </ul>

        </section>
        <section aria-labelledby="andamento">

            <h2 id="andamento">Em andamento</h2>
            <ul>
            </ul>

        </section>
        <section aria-labelledby="revisao">

            <h2 id="revisao">Em revisão</h2>
            <ul>
            </ul>

        </section>
        <section aria-labelledby="concluida">

            <h2 id="concluida">Concluída</h2>
            <ul>
            </ul>

        </section>

    </main>
</body>

</html>
