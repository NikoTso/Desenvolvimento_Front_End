<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
        <p>Quadro de organização de tarefas de projetos</p>
    </header>

    <main>

        <div id="status" role="status" aria-live="polite"></div>

        <section class="filtros" aria-labelledby="titulo-filtros">

            <h2 id="titulo-filtros">Busca</h2>

            <form>
                <div class="campo-busca">
                    <label for="busca">Buscar tarefa por título:</label>
                    <input type="search" id="busca" name="busca">
                </div>

                <fieldset class="opcoes">
                    <legend>Status</legend>

                    <label class="opcao">
                        <input type="radio" name="status">
                        Todos
                    </label>

                    <label class="opcao">
                        <input type="radio" name="status">
                        A fazer
                    </label>

                    <label class="opcao">
                        <input type="radio" name="status">
                        Em andamento
                    </label>

                    <label class="opcao">
                        <input type="radio" name="status">
                        Em revisão
                    </label>

                    <label class="opcao">
                        <input type="radio" name="status">
                        Concluída
                    </label>
                </fieldset>

                <fieldset class="opcoes">
                    <legend>Prioridade</legend>

                    <label class="opcao">
                        <input type="radio" name="prioridade">
                        Baixa
                    </label>

                    <label class="opcao">
                        <input type="radio" name="prioridade">
                        Média
                    </label>

                    <label class="opcao">
                        <input type="radio" name="prioridade">
                        Alta
                    </label>
                </fieldset>
            </form>

        </section>

        <div class="quadro">

            <section class="coluna coluna--fazer" aria-labelledby="fazer">
                <h2 id="fazer">A fazer</h2>
                <ul></ul>
            </section>

            <section class="coluna coluna--andamento" aria-labelledby="andamento">
                <h2 id="andamento">Em andamento</h2>
                <ul></ul>
            </section>

            <section class="coluna coluna--revisao" aria-labelledby="revisao">
                <h2 id="revisao">Em revisão</h2>
                <ul></ul>
            </section>

            <section class="coluna coluna--concluida" aria-labelledby="concluida">
                <h2 id="concluida">Concluída</h2>
                <ul></ul>
            </section>

        </div>

    </main>

    <footer>
        <p>
            Gabriel Oliveira Medeiros - Desenvolvimento Front-End
        </p>
    </footer>

    <script type="module" src="./js/app.js"></script>

</body>

</html>
